[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/private-assets/**"]

[[redirects]]
  from = "/cfe.html"
  to = "/.netlify/functions/api/content?path=cfe.html"
  status = 200
  force = true

[[redirects]]
  from = "/contracts.html"
  to = "/.netlify/functions/api/content?path=contracts.html"
  status = 200
  force = true

