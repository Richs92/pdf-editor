<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no"><title>Mi cuenta · Documento</title><link rel="stylesheet" href="/access.css"></head><body><header><a class="brand" href="/">documento<span>.</span></a><nav></nav></header><main class="narrow"><section class="panel"><p class="eyebrow">MI CUENTA</p><h1>Cambiar contraseña</h1><p class="muted" id="identity"></p><p class="notice" id="required" hidden>Tu contraseña es temporal. Cámbiala antes de entrar a las secciones.</p><form id="password-form"><div class="field"><label for="currentPassword">Contraseña actual</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label for="password">Nueva contraseña</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></div><div class="field"><label for="confirm">Repetir nueva contraseña</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></div><p class="hint">Usa al menos 12 caracteres y una contraseña diferente de la temporal.</p><button class="primary full">Guardar contraseña</button><p class="status" id="status" role="status" aria-live="polite"></p></form></section></main><script type="module" src="/account.js"></script></body></html>
