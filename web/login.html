<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no"><title>Iniciar sesión · Documento</title><link rel="stylesheet" href="/access.css"></head><body><header><a class="brand" href="/">documento<span>.</span></a></header><main class="narrow"><section class="panel"><p class="eyebrow">TERMINAVIT · ACCESO PRIVADO</p><h1>Bienvenido</h1><p class="muted">Entra con la cuenta que te asignó el administrador.</p><form id="login"><div class="field"><label for="email">Usuario</label><input id="email" name="username" type="text" autocapitalize="none" spellcheck="false" autocomplete="username" required></div><div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"></div><button class="primary full">Iniciar sesión</button><p class="status" id="status" role="status" aria-live="polite"></p></form><p class="hint">Si olvidaste tu contraseña, solicita una nueva al administrador.</p></section></main><script type="module" src="/login.js"></script></body></html>
